    <!-- 4D Background Canvas Script -->
    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        const particleCount = Math.floor((window.innerWidth * window.innerHeight) / 16000);

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.7,
                vy: (Math.random() - 0.5) * 0.7,
                radius: Math.random() * 2 + 1
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(0, 242, 254, 0.45)';
            ctx.strokeStyle = 'rgba(0, 242, 254, 0.07)';

            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 130) {
                        ctx.lineWidth = 1 - dist / 130;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>

    <!-- Firebase Auth & Cloud Firestore Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getAuth,
            signInWithPopup,
            GoogleAuthProvider
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import {
            getFirestore,
            doc,
            setDoc,
            getDoc,
            updateDoc,
            collection,
            query,
            where,
            getDocs
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA6XeVnSY1HVleGyyW133nhmkQEvC6d9JQ",
            authDomain: "intervai-f6dcc.firebaseapp.com",
            projectId: "intervai-f6dcc",
            storageBucket: "intervai-f6dcc.firebasestorage.app",
            messagingSenderId: "360105759901",
            appId: "1:360105759901:web:c18f5f44a134c1c99b3074",
            measurementId: "G-405F7Q7342"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let generatedOtp = null;
        let resetTargetDocId = null;
        let otpExpiryTime = 0;

        // Google Login / Cloud Sync
        window.handleGoogleLogin = async function() {
            const btnText = document.getElementById('googleBtnText');
            const spinner = document.getElementById('googleSpinner');
            
            btnText.innerText = "Connecting to Google...";
            spinner.classList.remove('hidden');

            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                
                const userData = {
                    username: user.email ? user.email.split('@')[0] : "google_user",
                    fullName: user.displayName || "Google Candidate",
                    email: user.email,
                    photo: user.photoURL || "",
                    lastLogin: new Date().toISOString()
                };

                await setDoc(doc(db, "users", userData.username), userData, { merge: true });
                localStorage.setItem('intervai_current_user', JSON.stringify(userData));

                showAlert(`Welcome, ${userData.fullName}! Redirecting...`, "success");
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1500);
            } catch (error) {
                console.error("Firebase Auth Error:", error);
                btnText.innerText = "Continue with Google";
                spinner.classList.add('hidden');
                showAlert("Google Sign-In failed: " + error.message, "error");
            }
        };

        // Step 1: Send 6-Digit OTP via EmailJS
        window.sendResetOTP = async function() {
            const targetEmail = document.getElementById('resetEmailInput').value.trim().toLowerCase();
            const sendBtn = document.getElementById('sendOtpBtn');

            if (!targetEmail) {
                showAlert("Please enter your registered email address.", "error");
                return;
            }

            sendBtn.innerText = "Checking & Sending OTP...";
            sendBtn.disabled = true;

            try {
                const q = query(collection(db, "users"), where("email", "==", targetEmail));
                const querySnap = await getDocs(q);

                if (querySnap.empty) {
                    showAlert("No account found with this email address.", "error");
                    sendBtn.innerText = "Send 6-Digit OTP";
                    sendBtn.disabled = false;
                    return;
                }

                const userDoc = querySnap.docs[0];
                resetTargetDocId = userDoc.id;
                const userName = userDoc.data().fullName || userDoc.id;

                generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
                otpExpiryTime = Date.now() + 10 * 60 * 1000;

               await emailjs.send('service_93en4kh', 'template_tv0qjff', {
                        to_name: userName,
                        to_email: targetEmail,
                        email: targetEmail,
                        otp_code: generatedOtp
                    });

                document.getElementById('otpStep1').classList.add('hidden');
                document.getElementById('otpStep2').classList.remove('hidden');
                showAlert("6-digit OTP sent to " + targetEmail + "! Enter it below.", "success");
            } catch (error) {
                console.error("OTP Error:", error);
                showAlert("Failed to send OTP: " + (error.text || error.message), "error");
            } finally {
                sendBtn.innerText = "Send 6-Digit OTP";
                sendBtn.disabled = false;
            }
        };

        // Step 2: Verify OTP & Update Password in Firestore
        window.verifyOtpAndReset = async function() {
            const enteredOtp = document.getElementById('otpCodeInput').value.trim();
            const newPwd = document.getElementById('newResetPassword').value;
            const confirmBtn = document.getElementById('confirmOtpBtn');

            if (!generatedOtp || Date.now() > otpExpiryTime) {
                showAlert("OTP expired. Please request a new OTP.", "error");
                document.getElementById('otpStep2').classList.add('hidden');
                document.getElementById('otpStep1').classList.remove('hidden');
                return;
            }

            if (enteredOtp !== generatedOtp) {
                showAlert("Invalid OTP. Please check your email and try again.", "error");
                return;
            }

            const passwordRegex = /^(?=.*[0-9])(?=.*[!@#$%^&*(),.?":{}|<>_])[a-zA-Z0-9!@#$%^&*(),.?":{}|<>_]{8,15}$/;
            if (!passwordRegex.test(newPwd)) {
                showAlert("New password must be 8-15 characters long, alphanumeric, and contain at least 1 special character.", "error");
                return;
            }

            confirmBtn.innerText = "Updating Password...";
            confirmBtn.disabled = true;

            try {
                await updateDoc(doc(db, "users", resetTargetDocId), {
                    password: newPwd,
                    updatedAt: new Date().toISOString()
                });

                generatedOtp = null;
                resetTargetDocId = null;
                document.getElementById('otpCodeInput').value = "";
                document.getElementById('newResetPassword').value = "";
                document.getElementById('resetEmailInput').value = "";
                toggleForgotBox(false);

                showAlert("Password updated successfully! You can now Sign In with your new password.", "success");
            } catch (error) {
                console.error("Update Error:", error);
                showAlert("Failed to update password: " + error.message, "error");
            } finally {
                confirmBtn.innerText = "Verify OTP & Update Password";
                confirmBtn.disabled = false;
            }
        };

        window.dbRef = { db, doc, setDoc, getDoc };
    </script>

    <!-- UI Helper & Cloud Database Handlers -->
    <script>
        let currentMode = 'signin';
        let recaptchaWidgetId = null;

        window.toggleForgotBox = function(show) {
            const box = document.getElementById('forgotPasswordBox');
            if (show) {
                box.classList.remove('hidden');
                document.getElementById('otpStep1').classList.remove('hidden');
                document.getElementById('otpStep2').classList.add('hidden');
                document.getElementById('resetEmailInput').focus();
            } else {
                box.classList.add('hidden');
            }
        };

        function switchTab(mode) {
            currentMode = mode;
            const tabSignin = document.getElementById('tabSignin');
            const tabSignup = document.getElementById('tabSignup');
            const nameFieldContainer = document.getElementById('nameFieldContainer');
            const emailFieldContainer = document.getElementById('emailFieldContainer');
            const captchaWidgetContainer = document.getElementById('captchaWidgetContainer');
            const signinOptions = document.getElementById('signinOptions');
            const submitBtnText = document.getElementById('submitBtnText');
            hideAlert();

            if (mode === 'signin') {
                tabSignin.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all duration-300 bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-lg shadow-cyan-500/20";
                tabSignup.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all duration-300 text-slate-400 hover:text-white";
                nameFieldContainer.classList.add('hidden');
                emailFieldContainer.classList.add('hidden');
                captchaWidgetContainer.classList.add('hidden');
                document.getElementById('fullName').required = false;
                document.getElementById('email').required = false;
                signinOptions.classList.remove('hidden');
                submitBtnText.innerText = "Sign In to Dashboard";
            } else {
                tabSignup.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all duration-300 bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-lg shadow-cyan-500/20";
                tabSignin.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all duration-300 text-slate-400 hover:text-white";
                nameFieldContainer.classList.remove('hidden');
                emailFieldContainer.classList.remove('hidden');
                captchaWidgetContainer.classList.remove('hidden');
                document.getElementById('fullName').required = true;
                document.getElementById('email').required = true;
                signinOptions.classList.add('hidden');
                toggleForgotBox(false);
                submitBtnText.innerText = "Create Account";

                setTimeout(() => {
                    if (window.grecaptcha && recaptchaWidgetId === null) {
                        try {
                            recaptchaWidgetId = grecaptcha.render('recaptchaContainer', {
                                'sitekey': '6Le0HgMuAAAAAMhQR3ups0eeQ90_hYT7ECrRqGD5',
                                'theme': 'dark'
                            });
                        } catch (e) {
                            console.log("reCAPTCHA render error:", e);
                        }
                    }
                }, 100);
            }
        }

        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.className = "fa-solid fa-eye-slash";
            } else {
                pwdInput.type = 'password';
                eyeIcon.className = "fa-solid fa-eye";
            }
        }

        window.showAlert = function(message, type = 'success') {
            const alertBox = document.getElementById('authAlert');
            const alertMsg = document.getElementById('alertMessage');
            const alertIcon = document.getElementById('alertIcon');

            alertMsg.innerText = message;
            alertBox.classList.remove('hidden');

            if (type === 'success') {
                alertBox.className = "mb-4 p-3 rounded-xl text-xs font-medium border bg-emerald-950/40 border-emerald-500/30 text-emerald-300 flex items-center gap-3";
                alertIcon.className = "fa-solid fa-circle-check text-emerald-400 text-base";
            } else if (type === 'error') {
                alertBox.className = "mb-4 p-3 rounded-xl text-xs font-medium border bg-rose-950/40 border-rose-500/30 text-rose-300 flex items-center gap-3";
                alertIcon.className = "fa-solid fa-circle-exclamation text-rose-400 text-base";
            } else {
                alertBox.className = "mb-4 p-3 rounded-xl text-xs font-medium border bg-cyan-950/40 border-cyan-500/30 text-cyan-300 flex items-center gap-3";
                alertIcon.className = "fa-solid fa-circle-info text-cyan-400 text-base";
            }
        }

        function hideAlert() {
            document.getElementById('authAlert').classList.add('hidden');
        }

        // Send Welcome Email using EmailJS service
        function sendWelcomeEmail(fullName, userEmail) {
            const templateParams = {
                to_name: fullName,
                to_email: userEmail,
                message: `Hi ${fullName},\n\nWelcome to IntervAI! 🎉\nWe're excited to have you on board!\n\nPreparing for interviews can be challenging, but with IntervAI, you don't have to do it alone. Our AI-powered interview platform helps you practice real-world interview scenarios, improve your communication skills, and build the confidence you need to succeed.\n\nHere's what you can do with IntervAI:\n🎯 Practice mock interviews with AI-powered virtual interviewers.\n💬 Improve your communication and answering skills.\n📊 Get instant feedback on your interview performance.\n🚀 Identify your strengths and work on areas that need improvement.\n💡 Prepare for your next interview with greater confidence.\n\nWhether you're preparing for your first job interview or aiming for your next career opportunity, IntervAI is here to help you improve with every practice session.\n\nReady to get started?\nLog in to your IntervAI account and take your first step towards becoming interview-ready!\n\nWe're glad you're here, and we look forward to being part of your journey.\n\nBest regards,\nTeam IntervAI\nPractice Smarter. Interview Better. Succeed with Confidence.`
            };

            emailjs.send('service_93en4kh', 'template_rilq2id', templateParams)
                .then(function(response) {
                    console.log('Welcome email successfully sent!', response.status, response.text);
                }, function(error) {
                    console.error('Failed to send welcome email.', error);
                });
        }

        // Manual Sign Up & Sign In with Cloud Firestore
        async function handleAuthSubmit(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            
            const submitBtnText = document.getElementById('submitBtnText');
            const submitSpinner = document.getElementById('submitSpinner');

            if (currentMode === 'signup') {
                const passwordRegex = /^(?=.*[0-9])(?=.*[!@#$%^&*(),.?":{}|<>_])[a-zA-Z0-9!@#$%^&*(),.?":{}|<>_]{8,15}$/;
                if (!passwordRegex.test(password)) {
                    showAlert("Password must be 8-15 characters long, alphanumeric, and contain at least 1 special character.", "error");
                    return;
                }

                const recaptchaResponse = recaptchaWidgetId !== null ? grecaptcha.getResponse(recaptchaWidgetId) : grecaptcha.getResponse();
                if (!recaptchaResponse || recaptchaResponse.length === 0) {
                    showAlert("Please complete the reCAPTCHA verification.", "error");
                    return;
                }
            }

            submitBtnText.innerText = currentMode === 'signup' ? "Checking Cloud..." : "Verifying Account...";
            submitSpinner.classList.remove('hidden');

            try {
                const { db, doc, setDoc, getDoc } = window.dbRef;
                const userDocRef = doc(db, "users", username);
                const userSnapshot = await getDoc(userDocRef);

                if (currentMode === 'signup') {
                    if (userSnapshot.exists()) {
                        showAlert("This username already exists! Please choose another one or sign in.", "error");
                        submitBtnText.innerText = "Create Account";
                        submitSpinner.classList.add('hidden');
                        if (recaptchaWidgetId !== null) grecaptcha.reset(recaptchaWidgetId);
                        return;
                    }

                    const newUser = {
                        username,
                        fullName,
                        email,
                        password,
                        createdAt: new Date().toISOString()
                    };

                    await setDoc(userDocRef, newUser);
                    localStorage.setItem('intervai_current_user', JSON.stringify({ username, fullName, email }));
                    
                    sendWelcomeEmail(fullName, email);

                    showAlert("Account created & welcome email sent successfully!", "success");
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1500);

                } else {
                    if (!userSnapshot.exists()) {
                        showAlert("Account not found in cloud. Please sign up first.", "error");
                        submitBtnText.innerText = "Sign In to Dashboard";
                        submitSpinner.classList.add('hidden');
                        return;
                    }

                    const userData = userSnapshot.data();
                    if (userData.password !== password) {
                        showAlert("Incorrect password. Please try again or reset via OTP.", "error");
                        submitBtnText.innerText = "Sign In to Dashboard";
                        submitSpinner.classList.add('hidden');
                        return;
                    }

                    localStorage.setItem('intervai_current_user', JSON.stringify({ 
                        username: userData.username, 
                        fullName: userData.fullName,
                        email: userData.email 
                    }));

                    showAlert(`Welcome back, ${userData.fullName}!`, "success");
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1500);
                }
            } catch (error) {
                console.error("Database Error:", error);
                showAlert("Database operation failed: " + error.message, "error");
                submitBtnText.innerText = currentMode === 'signup' ? "Create Account" : "Sign In to Dashboard";
                submitSpinner.classList.add('hidden');
                if (currentMode === 'signup' && recaptchaWidgetId !== null) grecaptcha.reset(recaptchaWidgetId);
            }
        }
    </script>
